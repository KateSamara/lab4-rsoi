fullnameOverride: library-system

image:
  repository: ""
  tag: "latest"

service:
  port: 8060

env:
  - name: DOCKER_CONNECTION_STRING
    value: "Host=postgres;Port=5432;Database=libraries;Username=postgres;Password=postgres"

livenessProbe:
  httpGet:
    path: /manage/health
    port: 8060
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /manage/health
    port: 8060
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3