name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Build services
        run: |
          dotnet build ./src/GatewayService/GatewayService.sln -c Release
          dotnet build ./src/LibrarySystem/LibrarySystem.sln -c Release
          dotnet build ./src/RatingSystem/RatingSystem.sln -c Release
          dotnet build ./src/ReservationSystem/ReservationSystem.sln -c Release

      - name: Run tests
        run: |
          dotnet test ./src/LibrarySystem/LibrarySystem.Tests.UnitTests/LibrarySystem.Tests.UnitTests.csproj -c Release --no-build --verbosity minimal
          dotnet test ./src/RatingSystem/RatingSystem.Tests.UnitTests/RatingSystem.Tests.UnitTests.csproj -c Release --no-build --verbosity minimal
          dotnet test ./src/ReservationSystem/ReservationSystem.Tests.UnitTests/ReservationSystem.Tests.UnitTests.csproj -c Release --no-build --verbosity minimal

      - name: Login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: oauth
          password: ${{ secrets.YC_OAUTH_TOKEN }}

      - name: Build and push images
        timeout-minutes: 15
        run: |
          docker build -t ${{ secrets.YC_CR_ID }}/gateway-service:latest -f ./gateway.dockerfile .
          docker build -t ${{ secrets.YC_CR_ID }}/library-system:latest -f ./library.dockerfile .
          docker build -t ${{ secrets.YC_CR_ID }}/rating-system:latest -f ./rating.dockerfile .
          docker build -t ${{ secrets.YC_CR_ID }}/reservation-system:latest -f ./reservation.dockerfile .

          docker push ${{ secrets.YC_CR_ID }}/gateway-service:latest
          docker push ${{ secrets.YC_CR_ID }}/library-system:latest
          docker push ${{ secrets.YC_CR_ID }}/rating-system:latest
          docker push ${{ secrets.YC_CR_ID }}/reservation-system:latest


      - uses: docker/setup-buildx-action@v2
      - name: Setup and Deploy to Yandex Cloud
        run: |
          echo "|"
          echo "|"
          echo "=== Installing Yandex Cloud CLI ==="
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a
          export PATH="/home/runner/yandex-cloud/bin:$PATH"

          echo "|"
          echo "|"
          echo "=== Installing kubectl ==="
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          echo "|"
          echo "|"
          echo "=== Installing Helm ==="
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

          echo "|"
          echo "|"
          echo "=== Configuring YC CLI ==="
          yc config set token "${{ secrets.YC_OAUTH_TOKEN }}"
          yc config set folder-id "${{ secrets.FOLDER_ID }}"
          yc container registry configure-docker

          echo "|"
          echo "|"
          echo "=== Getting kubeconfig ==="
          yc managed-kubernetes cluster get-credentials library-rsoi --external

          echo "|"
          echo "|"
          echo "=== Deploying Postgres ==="
          helm upgrade postgres ./charts/postgres --install -n test -f ./charts/postgres/values.yaml
          kubectl apply -f ./charts/postgres/templates/config-map.yaml -n test

          echo "|"
          echo "|"
          echo "=== Deploying application ==="
          helm upgrade gateway-service ./charts/services --install \
            --namespace test \
            -f ./charts/services/service-values/gateway-values.yaml \
            --set image.repository=${{secrets.YC_CR_ID}}/gateway-service \
            --set image.tag=latest

          helm upgrade library-system ./charts/services --install \
            --namespace test \
            -f ./charts/services/service-values/libraries-values.yaml \
            --set image.repository=${{secrets.YC_CR_ID}}/library-system \
            --set image.tag=latest

          helm upgrade rating-system ./charts/services --install \
            --namespace test \
            -f ./charts/services/service-values/ratings-values.yaml \
            --set image.repository=${{secrets.YC_CR_ID}}/rating-system \
            --set image.tag=latest

          helm upgrade reservation-system ./charts/services --install \
            --namespace test \
            -f ./charts/services/service-values/reservations-values.yaml \
            --set image.repository=${{secrets.YC_CR_ID}}/reservation-system \
            --set image.tag=latest

          echo "|"
          echo "|"
          echo "=== Waiting for services ==="
          kubectl wait -n test -l app.kubernetes.io/instance=library-system pod --for=condition=Ready --timeout=180s
          kubectl wait -n test -l app.kubernetes.io/instance=rating-system pod --for=condition=Ready --timeout=180s
          kubectl wait -n test -l app.kubernetes.io/instance=tickets-service pod --for=condition=Ready --timeout=180s
          kubectl wait -n test -l app.kubernetes.io/instance=reservation-system pod --for=condition=Ready --timeout=180s
      
      - name: Start port-forward to gateway
        run: |
          nohup kubectl port-forward service/gateway-service -n test 8080:8080 > port-forward.log 2>&1 &
          echo $! > port-forward.pid
          for i in $(seq 1 30); do
            if nc -z localhost 8080; then
              echo "Port-forward is ready."
              exit 0
            fi
            if ! kill -0 $(cat port-forward.pid) 2>/dev/null; then
              echo "Port-forward process exited unexpectedly."
              cat port-forward.log
              exit 1
            fi
            sleep 1
          done
          echo "Port-forward did not become ready in time."
          cat port-forward.log
          exit 1

      - name: Autograding
        uses: education/autograding@v1

      - name: Stop port-forward
        if: always()
        run: |
          if [ -f port-forward.pid ]; then
            kill $(cat port-forward.pid) >/dev/null 2>&1 || true
            rm -f port-forward.pid
          fi
          if [ -f port-forward.log ]; then
            echo "Port-forward log:"
            cat port-forward.log
            rm -f port-forward.log
          fi
